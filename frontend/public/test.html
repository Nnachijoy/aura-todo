<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura API Test</title>
  <style>
    body { font-family: system-ui; padding: 20px; background: #0a0a0b; color: #fff; max-width: 600px; margin: 0 auto; }
    h1 { color: #8B5CF6; font-size: 20px; }
    button { padding: 14px 24px; font-size: 16px; background: #8B5CF6; color: white; border: none; border-radius: 12px; margin: 8px 0; width: 100%; cursor: pointer; }
    button:active { background: #7c3aed; }
    pre { background: #141416; padding: 14px; border-radius: 12px; word-break: break-word; white-space: pre-wrap; font-size: 13px; border: 1px solid rgba(255,255,255,0.1); }
    .ok { color: #10b981; }
    .err { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🧪 Aura API Test</h1>
  <p>Tap the buttons below:</p>

  <button onclick="testRoot()">Test 1: Backend root</button>
  <button onclick="testTasks()">Test 2: Fetch tasks</button>
  <button onclick="testPost()">Test 3: Create a task</button>

  <pre id="out">Waiting...</pre>

  <script>
    const API = "https://aura-todo-4k9i.onrender.com";
    const out = document.getElementById("out");

    function log(msg, cls = "") {
      out.textContent += "\n" + msg;
      out.className = cls;
    }

    async function testRoot() {
      out.textContent = "Test 1: GET " + API + "/";
      try {
        const r = await fetch(API + "/");
        const data = await r.text();
        log("Status: " + r.status, "ok");
        log("Body: " + data, "ok");
      } catch (e) {
        log("FAILED: " + e.message, "err");
      }
    }

    async function testTasks() {
      out.textContent = "Test 2: GET " + API + "/tasks/ (with session header)";
      try {
        const r = await fetch(API + "/tasks/", {
          headers: { "X-Session-Id": "mobile-test-" + Date.now() }
        });
        const data = await r.text();
        log("Status: " + r.status, r.ok ? "ok" : "err");
        log("Body: " + data.slice(0, 300));
      } catch (e) {
        log("FAILED: " + e.message, "err");
        log("This usually means CORS is blocking or network issue.", "err");
      }
    }

    async function testPost() {
      out.textContent = "Test 3: POST " + API + "/tasks/";
      try {
        const r = await fetch(API + "/tasks/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Session-Id": "mobile-test-" + Date.now()
          },
          body: JSON.stringify({ title: "mobile-test-task" })
        });
        const data = await r.text();
        log("Status: " + r.status, r.ok ? "ok" : "err");
        log("Body: " + data.slice(0, 300));
      } catch (e) {
        log("FAILED: " + e.message, "err");
      }
    }
  </script>
</body>
</html>
